name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/proxdns .
          tar -czf proxdnx-linux-${{ matrix.arch }}.tar.gz -C dist proxdnx
          # hash next to the file we just created — no cross-job glob guessing
          sha256sum proxdnx-linux-${{ matrix.arch }}.tar.gz > checksums-${{ matrix.arch }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: proxdnx-linux-${{ matrix.arch }}
          path: |
            proxdnx-linux-${{ matrix.arch }}.tar.gz
            checksums-${{ matrix.arch }}.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Merge checksums
        run: |
          ls -la
          cat checksums-amd64.txt checksums-arm64.txt > checksums.txt
          cat checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            proxdnx-linux-*.tar.gz
            checksums.txt
          generate_release_notes: true
